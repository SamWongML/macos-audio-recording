name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The app targets macOS 27, so the build needs the macOS 27 SDK. This image is the only
    # hosted one that carries it, and Xcode 27 is already its default toolchain — so there is
    # nothing to select, and no beta-numbered path to rot when the image is rebuilt.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      # Stated once, up front: a toolchain older than the deployment target fails deep inside
      # the compiler otherwise, and the version is the first thing anyone reads the log for.
      - name: State the toolchain
        run: |
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Lint
        run: $(xcrun --find swift-format) lint --strict --recursive AppTape

      - name: Build and test
        run: |
          xcodebuild test \
            -project AppTape/AppTape.xcodeproj \
            -scheme AppTape \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions
        # Carries `-o pipefail`, without which a failing xcodebuild reports the exit code of
        # xcbeautify and the job passes.
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults.xcresult
